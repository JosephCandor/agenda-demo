<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sin conexión · El Ancla</title>
<meta name="theme-color" content="#14171c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#eceef1;--surface:#fff;--ink:#14171c;--muted:#5a616c;--red:#b3262e;--blue:#1f3f8a}
@media (prefers-color-scheme:dark){:root{--bg:#101318;--surface:#191d23;--ink:#e8ebef;--muted:#9aa2ad;--red:#e5575e;--blue:#7f9fe8;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.card{max-width:360px;background:var(--surface);border-radius:12px;overflow:hidden;text-align:center}
.pole{height:8px;background:repeating-linear-gradient(-45deg,var(--red) 0 12px,var(--surface) 12px 18px,var(--blue) 18px 30px,var(--surface) 30px 36px)}
.in{padding:24px;display:grid;gap:12px}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--muted);line-height:1.5}
button{justify-self:center;padding:11px 20px;border:none;border-radius:8px;background:var(--red);color:#fff;font:inherit;font-weight:600}
</style>
</head>
<body>
<div class="card"><div class="pole"></div><div class="in">
  <img src="icons/icon-192.png" alt="" width="64" height="64" style="justify-self:center;border-radius:14px">
  <h1>Sin conexión</h1>
  <p>No hay internet en este momento. Revisa tu señal o Wi-Fi y vuelve a intentarlo para ver los horarios disponibles.</p>
  <button onclick="location.reload()">Reintentar</button>
</div></div>
</body>
</html>
